# SonarQube Project Configuration

# Project identification
sonar.projectKey=water-management-system
sonar.projectName=Water Management System
sonar.projectVersion=1.0

# Source and test directories
sonar.sources=controllers,models,services,repositories,config,utils
sonar.tests=tests

# Exclusions
sonar.exclusions=vendor/**,coverage/**,*.html,*.css,*.js,*.sql

# PHP specific settings
sonar.language=php
sonar.sourceEncoding=UTF-8

# Coverage reports (generated by PHPUnit with Xdebug)
sonar.php.coverage.reportPaths=coverage/clover.xml

# Test execution report
sonar.php.tests.reportPath=coverage/phpunit-report.xml
